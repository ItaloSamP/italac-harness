<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harness Hub — Mission Control</title>
  <meta name="description" content="Painel local-first de coordenação de agentes, Kanban Dual-Board, GitHub Inbox, Execução ao Vivo e Paridade Multi-AI." />
  <script src="./theme-init.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <div class="app-shell" id="app-shell">
    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <path d="M14 17.5h7"></path>
              <path d="M17.5 14v7"></path>
            </svg>
          </span>
          <div class="brand-text">
            <span class="brand-name">Harness Hub</span>
            <span class="brand-host mono">127.0.0.1</span>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon sidebar-collapse-btn" id="btn-sidebar-collapse" aria-label="Recolher barra lateral" title="Recolher barra lateral">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Visões do Harness Hub">
        <button type="button" class="nav-item is-active" data-nav="mission" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="12" x2="18.36" y2="5.64"></line>
            </svg>
          </span>
          <span class="nav-label">Mission Control</span>
        </button>

        <button type="button" class="nav-item" data-nav="kanban">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </span>
          <span class="nav-label">Kanban &amp; Backlog</span>
          <span class="nav-badge mono" id="nav-badge-kanban">0</span>
        </button>

        <button type="button" class="nav-item" data-nav="github">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </span>
          <span class="nav-label">GitHub Inbox</span>
          <span class="nav-badge mono" id="nav-badge-github">—</span>
        </button>

        <button type="button" class="nav-item" data-nav="queue">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <line x1="10" y1="6" x2="21" y2="6"></line>
              <line x1="10" y1="12" x2="21" y2="12"></line>
              <line x1="10" y1="18" x2="21" y2="18"></line>
              <path d="M4 6h1v4"></path>
              <path d="M4 10h2"></path>
              <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
            </svg>
          </span>
          <span class="nav-label">Fila de Demanda</span>
          <span class="nav-badge mono" id="nav-badge-queue">0</span>
        </button>

        <button type="button" class="nav-item" data-nav="schedule">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span class="nav-label">Agenda Semanal</span>
          <span class="nav-badge mono" id="nav-badge-schedule">0</span>
        </button>

        <button type="button" class="nav-item" data-nav="agents">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </span>
          <span class="nav-label">Agentes &amp; Incidentes</span>
          <span class="nav-badge mono" id="nav-badge-agents">0</span>
        </button>

        <button type="button" class="nav-item" data-nav="adapters">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              <rect x="9" y="9" width="6" height="6"></rect>
              <line x1="9" y1="1" x2="9" y2="4"></line>
              <line x1="15" y1="1" x2="15" y2="4"></line>
              <line x1="9" y1="20" x2="9" y2="23"></line>
              <line x1="15" y1="20" x2="15" y2="23"></line>
              <line x1="20" y1="9" x2="23" y2="9"></line>
              <line x1="20" y1="14" x2="23" y2="14"></line>
              <line x1="1" y1="9" x2="4" y2="9"></line>
              <line x1="1" y1="14" x2="4" y2="14"></line>
            </svg>
          </span>
          <span class="nav-label">Hub Multi-AI</span>
          <span class="nav-badge mono" id="nav-badge-adapters">0/4</span>
        </button>

        <div class="sidebar-section-divider" role="separator"></div>
        <div class="sidebar-section-label" title="Local e ignorado pelo Git">
          <span class="sidebar-section-icon" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <span class="sidebar-section-text">Privado</span>
        </div>

        <button type="button" class="nav-item" data-nav="calendar" title="Calendário &amp; Rotina — Local e ignorado pelo Git">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <path d="M8 14h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M16 14h.01"></path>
              <path d="M8 18h.01"></path>
              <path d="M12 18h.01"></path>
            </svg>
          </span>
          <span class="nav-label">Calendário &amp; Rotina</span>
          <span class="nav-badge mono" id="nav-badge-calendar">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-autorun">
          <label class="toggle-row" for="sidebar-autorun-switch">
            <span class="toggle-label-text">Auto-executar</span>
            <button type="button" role="switch" aria-checked="true" class="toggle is-checked" id="sidebar-autorun-switch" data-action="toggle-autorun" title="Ao arrastar para Em Execução, dispara o agente automaticamente">
              <span class="toggle-thumb"></span>
            </button>
          </label>
        </div>
        <button type="button" class="gate-health-pill" id="sidebar-gate-health" data-action="jump-gates" title="Ver saúde dos gates no Mission Control">
          <span class="status-dot"></span>
          <span class="gate-health-label">Gates: aguardando</span>
        </button>
      </div>
    </aside>

    <!-- Main column -->
    <div class="app-main">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="btn btn-ghost btn-icon mobile-menu-btn" id="btn-mobile-menu" aria-label="Abrir menu de navegação">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="topbar-title-group">
            <h1 class="topbar-title" id="topbar-title">Mission Control</h1>
            <span class="topbar-repo mono" id="topbar-repo">workflow</span>
          </div>
        </div>

        <div class="topbar-right">
          <button type="button" class="palette-trigger" id="btn-open-palette" aria-label="Abrir paleta de comandos (Ctrl+K)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span class="palette-placeholder">Buscar tarefas, agentes ou ações…</span>
            <kbd class="kbd">Ctrl K</kbd>
          </button>

          <div class="sse-pill is-reconnecting" id="sse-pill" role="status" aria-live="polite" title="Conexão em tempo real via Server-Sent Events">
            <span class="sse-dot" aria-hidden="true"></span>
            <span class="sse-label" id="sse-label">Conectando…</span>
          </div>

          <button type="button" class="btn btn-ghost btn-sm topbar-gh-btn" id="btn-github-drawer" title="Abrir GitHub Inbox lateral">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
            <span class="hide-mobile">Inbox</span>
            <span class="badge badge-neutral mono" id="topbar-gh-count">—</span>
          </button>

          <button type="button" class="btn btn-ghost btn-icon" id="btn-theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
            <span id="theme-icon-slot" aria-hidden="true"></span>
          </button>

          <button type="button" class="btn btn-primary" id="btn-new-task" data-write-control="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span class="hide-mobile">Nova tarefa</span>
          </button>
        </div>
      </header>

      <!-- Global Disconnected Banner -->
      <div class="disconnected-banner" id="disconnected-banner" role="alert" hidden>
        <div class="disconnected-banner-inner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span id="disconnected-banner-msg">Desconectado dos arquivos — dados podem estar desatualizados. Ações de escrita desabilitadas.</span>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-reconnect-sse">Tentar reconectar</button>
        </div>
      </div>

      <!-- Main View Area -->
      <main class="view-container" id="main-content" tabindex="-1">
        <div class="skeleton-page" aria-busy="true" aria-label="Carregando Harness Hub">
          <div class="skeleton-row">
            <div class="skeleton-box" style="height: 86px;"></div>
            <div class="skeleton-box" style="height: 86px;"></div>
            <div class="skeleton-box" style="height: 86px;"></div>
            <div class="skeleton-box" style="height: 86px;"></div>
          </div>
          <div class="skeleton-box" style="height: 240px;"></div>
        </div>
      </main>

      <!-- Live Execution Console Dock -->
      <section class="exec-console is-collapsed" id="exec-console" aria-label="Console de Execução ao Vivo"></section>
    </div>
  </div>

  <!-- Drawers & Modals Portals -->
  <div class="overlay-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="task-drawer" role="dialog" aria-modal="true" aria-label="Detalhes da tarefa" hidden></aside>
  <aside class="drawer drawer-narrow" id="github-drawer" role="dialog" aria-modal="true" aria-label="GitHub Inbox" hidden></aside>
  <aside class="drawer drawer-narrow" id="agent-drawer" role="dialog" aria-modal="true" aria-label="Histórico do agente" hidden></aside>

  <div class="overlay-backdrop modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-host" id="modal-root"></div>
  </div>

  <div class="overlay-backdrop palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" id="command-palette" role="dialog" aria-modal="true" aria-label="Paleta de comandos"></div>
  </div>

  <!-- Context Menu Portal -->
  <div class="context-menu" id="context-menu" role="menu" hidden></div>

  <!-- Toast Stack -->
  <div class="toast-stack" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
